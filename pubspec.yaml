name: cafe_des_amis
description: "HibiscusMS POS"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Database
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.5

  # Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # UI / formatting
  intl: ^0.20.1
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0       # graf rapò
  flutter_slidable: ^3.1.1

  # Image handling
  image_picker: ^1.1.2
  image: ^4.5.2

  # Bluetooth printer (ESC/POS) + SUNMI integrated printer
  esc_pos_utils_plus: ^2.0.4
  print_bluetooth_thermal: ^1.1.0
  sunmi_printer_plus: ^3.0.0
  device_info_plus: ^11.2.0

  # Permissions
  permission_handler: ^11.3.1

  # Google Drive backup
  google_sign_in: ^6.2.2
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  http: ^1.2.2
  extension_google_sign_in_as_googleapis_auth: ^2.0.12

  # Local storage / settings
  shared_preferences: ^2.3.4

  # URL launcher pou download
  url_launcher: ^6.3.1
  flutter_secure_storage: ^9.2.2

  # API client (sync ak backend)
  dio: ^5.7.0
  connectivity_plus: ^6.1.0

  # Barcode scanner
  mobile_scanner: ^5.2.3

  # Utilities
  uuid: ^4.5.1
  ulid: ^2.0.0
  archive: ^4.0.2
  collection: ^1.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.13
  freezed: ^3.2.4
  json_serializable: ^6.9.0

  # App icon generation
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  min_sdk_android: 23

flutter_native_splash:
  color: "#001B6E"
  background_image: "assets/images/splash.png"
  android_12:
    color: "#001B6E"
    image: "assets/images/app_icon.png"
    icon_background_color: "#FFFFFF"
  fullscreen: true
  android: true
  ios: false
